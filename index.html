<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07131f" />
  <meta name="color-scheme" content="dark" />
  <title>MCXOR · 存档解密</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene-image"></div>
    <div class="scene-color"></div>
    <canvas id="rain-canvas"></canvas>
    <canvas id="glass-canvas"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <div class="app-shell">
    <header class="topbar glass-panel">
      <a class="brand" href="./" aria-label="MCXOR 存档解密">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 18V10m6 8V6m6 12V3"/></svg></span>
        <span class="brand-name">MCXOR</span>
      </a>
      <div class="top-actions">
        <span class="local-state" title="所有处理都在当前设备完成"><i></i><span>本地</span></span>
        <button class="icon-button" data-action="theme" title="切换明暗模式" aria-label="切换明暗模式"><span id="theme-icon"></span></button>
        <button class="icon-button" data-action="help" title="使用帮助" aria-label="使用帮助"><span id="top-help-icon"></span></button>
      </div>
    </header>

    <main class="tool-layout">
      <section class="workspace glass-panel" aria-labelledby="tool-title">
        <div class="panel-top">
          <div class="panel-heading">
            <span class="section-kicker">ARCHIVE TOOL</span>
            <h1 id="tool-title">解密存档</h1>
          </div>
          <span class="secure-badge" title="文件只在浏览器本地处理"><span id="secure-icon"></span><span>仅本地</span></span>
        </div>

        <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="选择或拖入 ZIP 存档">
          <div class="upload-orb" id="upload-icon"></div>
          <h2>拖入 .zip 存档</h2>
          <p>或点击选择文件</p>
          <span class="drop-meta">文件不会离开设备</span>
          <input id="file-input" type="file" accept=".zip,application/zip" hidden />
        </div>

        <div class="file-card hidden" id="file-card">
          <div class="file-icon" id="file-icon"></div>
          <div class="file-copy"><strong id="file-name">—</strong><span id="file-size">—</span></div>
          <button class="remove-button" data-action="clear" aria-label="移除文件">移除</button>
        </div>

        <div class="key-box hidden" id="key-box">
          <div class="key-title" id="key-icon"></div>
          <div class="key-copy"><strong>输入密钥</strong><p>未能从存档读取密钥，需要 16 位十六进制字符。</p></div>
          <input id="manual-key" maxlength="16" inputmode="text" autocomplete="off" spellcheck="false" placeholder="3838333239383531" aria-label="16 位十六进制密钥" />
        </div>

        <div class="actions">
          <button class="primary-button" id="decrypt-button" disabled><span id="decrypt-icon"></span><span>开始解密</span><span class="button-arrow" id="arrow-icon" aria-hidden="true"></span></button>
        </div>

        <div class="progress-area hidden" id="progress-area" aria-live="polite">
          <div class="progress-head"><span id="progress-status">准备中</span><b id="progress-value">0%</b></div>
          <div class="progress-track"><i id="progress-bar"></i></div>
          <code id="progress-file">等待任务</code>
        </div>
        <div class="result hidden" id="result" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <dialog id="modal">
    <div class="modal-inner">
      <button class="modal-close" data-action="close" aria-label="关闭"><span id="close-icon"></span></button>
      <div id="modal-content"></div>
    </div>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
